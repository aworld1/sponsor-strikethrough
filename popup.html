<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Sponsor Strikethrough Popup</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f9f9f9;
            width: 360px;
        }

        .header {
            background-color: #fff;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
        }

        .header img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        .header .title {
            font-size: 18px;
            font-weight: 600;
        }

        .content {
            padding: 15px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .toggle-label {
            font-size: 14px;
            color: #333;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4caf50;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .whitelist-section {
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .whitelist-section h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .whitelist-input {
            display: flex;
            margin-bottom: 8px;
        }

        .whitelist-input input {
            flex: 1;
            padding: 6px 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .whitelist-input button {
            background-color: #0070ba;
            color: #fff;
            border: none;
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
        }

        .whitelist-list {
            list-style: none;
            padding-left: 15px;
            margin: 0;
            max-height: 100px;
            overflow-y: auto;
        }

        .whitelist-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .whitelist-list span {
            font-size: 14px;
            color: #444;
        }

        .whitelist-list button {
            background-color: #f44336;
            color: #fff;
            border: none;
            padding: 3px 6px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .donate-btn {
            display: block;
            width: 100%;
            padding: 8px 0;
            background-color: #0070ba;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }

        .donate-btn:hover {
            background-color: #005c93;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon48.png" alt="Extension Icon" />
        <div class="title">Sponsor Strikethrough</div>
    </div>

    <div class="content">
        <div class="toggle-row">
            <span class="toggle-label">Enable Strikethrough</span>
            <label class="switch">
                <input type="checkbox" id="toggleStrikethrough" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <span class="toggle-label">Enable Opacity</span>
            <label class="switch">
                <input type="checkbox" id="toggleOpacity" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <span class="toggle-label">Red Background</span>
            <label class="switch">
                <input type="checkbox" id="toggleRedBackground" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <span class="toggle-label">Hide Sponsored</span>
            <label class="switch">
                <input type="checkbox" id="toggleHideSponsored" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="whitelist-section">
            <h3>Whitelist</h3>
            <p style="margin-top:0; font-size:13px; color:#666;">
                Add domains (e.g. <strong>google.com</strong>) where the extension should not run
            </p>

            <div class="whitelist-input">
                <input type="text" id="whitelistDomain" placeholder="e.g. google.com" />
                <button id="addWhitelistBtn">Add</button>
            </div>

            <ul class="whitelist-list" id="whitelistList"></ul>
        </div>

        <button id="donateBtn" class="donate-btn">Donate</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
