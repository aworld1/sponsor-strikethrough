<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Sponsor Strikethrough Popup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 300px;
            background-color: #f8f9fa;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #ffffff;
            border-bottom: 1px solid #ccc;
        }

        .header img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        .header .title {
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            padding: 10px 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
            margin-right: 8px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4caf50;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .option-label {
            font-size: 14px;
        }

        /* Counters area, similar to Adblock */
        .counters {
            margin-top: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 8px;
        }

        .counters h3 {
            margin: 0 0 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .donate-btn {
            display: block;
            width: 100%;
            padding: 8px 0;
            background-color: #0070ba;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }

        .donate-btn:hover {
            background-color: #005c93;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icon48.png" alt="Extension Icon" />
        <div class="title">Sponsor Strikethrough</div>
    </div>

    <div class="content">
        <div class="option-row">
            <span class="option-label">Enable Strikethrough</span>
            <label class="switch">
                <input type="checkbox" id="toggleStrikethrough" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-row">
            <span class="option-label">Enable Opacity</span>
            <label class="switch">
                <input type="checkbox" id="toggleOpacity" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-row">
            <span class="option-label">Red Background</span>
            <label class="switch">
                <input type="checkbox" id="toggleRedBackground" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-row">
            <span class="option-label">Hide Sponsored</span>
            <label class="switch">
                <input type="checkbox" id="toggleHideSponsored" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="counters">
            <h3>Number of items blocked</h3>
            <div class="counter-row">
                <span>On this page:</span>
                <span id="pageCount">0</span>
            </div>
            <div class="counter-row">
                <span>In total:</span>
                <span id="totalCount">0</span>
            </div>
        </div>

        <button id="donateBtn" class="donate-btn">Donate</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
